<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Sign In to ECOZIA - Access your account and manage your orders">
  <title>Sign In - ECOZIA</title>
  <link rel="stylesheet" href="style.css" />
  <script defer src="script.js"></script>
</head>

<body>
  <!-- Navigation -->
  <header class="navbar">
    <div class="container">
      <div class="nav-brand">
        <a href="index.html"><h1>🌱 ECOZIA</h1></a>
      </div>
      <nav class="nav-menu">
        <a href="index.html#home">Home</a>
        <a href="products.html">Products</a>
        <a href="index.html#about">About</a>
        <a href="index.html#pricing">Pricing</a>
        <a href="index.html#contact">Contact</a>
        <a href="signin.html" class="signin-link active">Sign In</a>
      </nav>
      <button class="mobile-menu-toggle" aria-label="Toggle menu">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>
  </header>

  <!-- Sign In Section -->
  <section class="auth-section">
    <div class="container">
      <div class="auth-container">
        <div class="auth-header">
          <h1>Welcome Back!</h1>
          <p>Sign in to your ECOZIA account</p>
        </div>

        <form class="auth-form" id="signInForm" onsubmit="handleSignIn(event)">
          <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" placeholder="your.email@example.com" required>
          </div>

          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="Enter your password" required>
          </div>

          <div class="form-options">
            <label class="checkbox-label">
              <input type="checkbox" name="remember">
              <span>Remember me</span>
            </label>
            <a href="#" class="forgot-password">Forgot Password?</a>
          </div>

          <button type="submit" class="btn-auth">Sign In</button>

          <div class="auth-divider">
            <span>OR</span>
          </div>

          <button type="button" class="btn-google">
            <span>🔵</span> Continue with Google
          </button>

          <p class="auth-footer">
            Don't have an account? <a href="#" onclick="showSignUp(); return false;">Sign Up</a>
          </p>
        </form>

        <!-- Sign Up Form (hidden by default) -->
        <form class="auth-form" id="signUpForm" onsubmit="handleSignUp(event)" style="display: none;">
          <div class="auth-header">
            <h1>Create Account</h1>
            <p>Join ECOZIA today</p>
          </div>

          <div class="form-group">
            <label for="signup-name">Full Name</label>
            <input type="text" id="signup-name" name="name" placeholder="John Doe" required>
          </div>

          <div class="form-group">
            <label for="signup-email">Email Address</label>
            <input type="email" id="signup-email" name="email" placeholder="your.email@example.com" required>
          </div>

          <div class="form-group">
            <label for="signup-phone">Phone Number</label>
            <input type="tel" id="signup-phone" name="phone" placeholder="071-2345678">
          </div>

          <div class="form-group">
            <label for="signup-password">Password</label>
            <input type="password" id="signup-password" name="password" placeholder="Create a password" required minlength="6">
          </div>

          <div class="form-group">
            <label for="signup-confirm">Confirm Password</label>
            <input type="password" id="signup-confirm" name="confirmPassword" placeholder="Confirm your password" required>
          </div>

          <label class="checkbox-label">
            <input type="checkbox" name="terms" required>
            <span>I agree to the <a href="#">Terms & Conditions</a> and <a href="#">Privacy Policy</a></span>
          </label>

          <button type="submit" class="btn-auth">Sign Up</button>

          <p class="auth-footer">
            Already have an account? <a href="#" onclick="showSignIn(); return false;">Sign In</a>
          </p>
        </form>
      </div>
    </div>
  </section>

  <script>
    function showSignUp() {
      document.getElementById('signInForm').style.display = 'none';
      document.getElementById('signUpForm').style.display = 'block';
    }

    function showSignIn() {
      document.getElementById('signUpForm').style.display = 'none';
      document.getElementById('signInForm').style.display = 'block';
    }

    function handleSignIn(event) {
      event.preventDefault();
      const formData = new FormData(event.target);
      const data = Object.fromEntries(formData);
      
      // Save user session
      localStorage.setItem('ecozia_user', JSON.stringify({
        email: data.email,
        loggedIn: true,
        timestamp: new Date().toISOString()
      }));
      
      // Redirect to profile or home
      window.location.href = 'profile.html';
    }

    function handleSignUp(event) {
      event.preventDefault();
      const formData = new FormData(event.target);
      const data = Object.fromEntries(formData);
      
      if (data.password !== data.confirmPassword) {
        alert('Passwords do not match!');
        return;
      }
      
      // Save user data
      const userData = {
        name: data.name,
        email: data.email,
        phone: data.phone,
        loggedIn: true,
        timestamp: new Date().toISOString()
      };
      
      localStorage.setItem('ecozia_user', JSON.stringify(userData));
      
      // Redirect to profile
      window.location.href = 'profile.html';
    }

    // Check if already logged in
    const user = localStorage.getItem('ecozia_user');
    if (user) {
      const userData = JSON.parse(user);
      if (userData.loggedIn) {
        window.location.href = 'profile.html';
      }
    }
  </script>
</body>
</html>
